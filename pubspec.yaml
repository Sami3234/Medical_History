name: medical_history
description: "A family-based medical history management system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # File Handling
  image_picker: ^1.1.2
  archive: ^4.1.0
  file_picker: ^8.1.7

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  pdf: ^3.11.3
  printing: ^5.14.2

  # Authentication
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  http: ^1.6.0
  crypto: ^3.0.6
  image_cropper: ^12.2.1
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
